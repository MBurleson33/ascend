<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04060d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ascend">
<title>Ascend — Level Up</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Turn working out into an RPG. Clear Daily Quests, level up and rank from E to S.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Oxanium:wght@500;700;800&family=Chakra+Petch:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: an anime "System" HUD plus a coach who talks to you like a visual novel.
   IDEA: holographic heads-up display floating over a night grid.
   PICTURE: your own drawn character with a rank aura, and the coach's dialogue box.
   COLOUR and TYPE: void black, hologram cyan + violet, gold for rewards; Orbitron, Oxanium, Chakra Petch.
   LAYOUT: phone column with bottom tabs; two columns on desktop. */
:root{color-scheme:dark;--bg:#04060d;--c1:#3ef0ff;--c2:#9b6bff;--ink:#eaf6ff;--dim:#8ea3c6;--gold:#ffcf5a;--red:#ff4f6d;--ok:#4dffb5}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.5 "Chakra Petch",system-ui,sans-serif;overflow-x:clip;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom));
 background:radial-gradient(800px 480px at 10% -8%,rgba(155,107,255,.28),transparent 60%),radial-gradient(900px 560px at 105% 0%,rgba(62,240,255,.18),transparent 55%),
 linear-gradient(rgba(62,240,255,.05) 1px,transparent 1px) 0 0/34px 34px,linear-gradient(90deg,rgba(62,240,255,.05) 1px,transparent 1px) 0 0/34px 34px,var(--bg);background-attachment:fixed}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;background:rgba(4,6,13,.8);backdrop-filter:blur(12px);border-bottom:1px solid rgba(62,240,255,.18)}
.brand{display:flex;align-items:center;gap:10px}
.mini{width:38px;height:38px;border-radius:50%;overflow:hidden;border:1.5px solid var(--c1);box-shadow:0 0 12px rgba(62,240,255,.5);background:#0b1430;flex:none}
.mini svg{width:100%;height:100%;display:block}
.logo{font:900 18px/1 Orbitron,sans-serif;letter-spacing:.14em;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font:700 12px/1 Oxanium,sans-serif;padding:7px 10px;border:1px solid rgba(62,240,255,.45);color:var(--c1);white-space:nowrap;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.chip.hot{border-color:rgba(255,207,90,.6);color:var(--gold)}
main{max-width:1020px;margin:0 auto;padding:16px 14px;display:grid;gap:16px}
@media(min-width:820px){main{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}.wide{grid-column:1/-1}}
.panel{--cut:16px;--k1:var(--c1);--k2:var(--c2);position:relative;padding:18px;border:1px solid transparent;
 clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)));
 background:linear-gradient(225deg,transparent 10.8px,var(--k1) 10.8px,var(--k1) 12.4px,transparent 12.4px),linear-gradient(45deg,transparent 10.8px,var(--k2) 10.8px,var(--k2) 12.4px,transparent 12.4px),
 linear-gradient(160deg,rgba(14,24,52,.93),rgba(7,11,24,.95)) padding-box,linear-gradient(135deg,var(--k1),rgba(62,240,255,.12) 35%,rgba(155,107,255,.12) 65%,var(--k2)) border-box}
.panel.red{--k1:var(--red);--k2:#ff9a5a}
.panel.gold{--k1:var(--gold);--k2:#ff9a5a}
h2{font:700 15px/1.25 Orbitron,sans-serif;letter-spacing:.06em;margin:0 0 6px;color:var(--ink)}
.sys{font:700 11px/1.2 Oxanium,sans-serif;letter-spacing:.12em;color:var(--c1);margin:0 0 8px;text-transform:uppercase}
.sys::before{content:"▸ ";color:var(--c2)}
.red .sys{color:var(--red)}
.dim{color:var(--dim)}.small{font-size:13px}
p{margin:6px 0}
.bar{height:10px;background:rgba(62,240,255,.1);overflow:hidden;clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c2),var(--c1));box-shadow:0 0 12px var(--c1);transition:width .5s}
.bar.g i{background:linear-gradient(90deg,#1fbf8a,var(--ok))}
.bar.r i{background:linear-gradient(90deg,#b8263f,var(--red))}
.b{min-height:44px;padding:0 16px;border:1px solid rgba(62,240,255,.4);background:rgba(62,240,255,.07);font-weight:600;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.b:hover{background:rgba(62,240,255,.15)}
.b.p{background:linear-gradient(100deg,var(--c2),#3e8cff 55%,var(--c1));border-color:transparent;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.b.g{border-color:rgba(255,207,90,.6);color:var(--gold);background:rgba(255,207,90,.08)}
.b.r{border-color:rgba(255,79,109,.6);color:var(--red);background:rgba(255,79,109,.08)}
.b:disabled{opacity:.4;cursor:default}
.b.full{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.qb{display:grid;grid-template-columns:repeat(auto-fit,minmax(54px,1fr))}.qb .b{padding:0 8px}
.clear{color:var(--ok);font:700 15px Oxanium,sans-serif;margin-top:8px}
/* coach dialogue */
.vn{display:grid;grid-template-columns:132px minmax(0,1fr);align-items:end;padding:0 16px 0 0;min-height:200px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.vnport svg{display:block;width:150px;height:165px;margin-left:-14px}
.vnport{align-self:start;margin-top:26px;overflow:hidden}
.vnport img{display:block;width:150px;height:150px;margin-left:-12px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 15%,#000 82%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 15%,#000 82%,transparent 100%)}
.ghost{visibility:hidden}
.vnbody{padding:16px 0 14px 8px;position:relative;align-self:stretch;display:flex;flex-direction:column}
.vnname{align-self:flex-start;font:700 12px/1 Orbitron,sans-serif;letter-spacing:.1em;color:#05060d;background:linear-gradient(90deg,var(--c1),var(--c2));padding:6px 16px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.vnrole{font-size:12px;color:var(--dim);margin:4px 0 0}
#vnText{font-size:16px;line-height:1.45;margin:8px 0 0;flex:1;min-height:93px}
.vnch{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.vnch button{min-height:40px;padding:0 14px;font:600 14px 'Chakra Petch',sans-serif;color:#fff;border:1px solid var(--c1);background:rgba(62,240,255,.12);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.vnch button:hover{background:rgba(62,240,255,.25)}
.sqt{font:800 40px/1 Oxanium,sans-serif;color:var(--gold);text-shadow:0 0 16px rgba(255,207,90,.6);margin:8px 0;font-variant-numeric:tabular-nums}
.quest[data-a]{cursor:pointer}
.quest.on{padding:14px 12px;margin:4px -12px;background:rgba(62,240,255,.06);border-top-color:transparent}
.quest.on+.quest{border-top-color:transparent}
.quest.qdone b{color:var(--dim)}
.qtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.bonus{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.bn{min-height:64px;border:1px solid rgba(62,240,255,.3);background:rgba(62,240,255,.06);display:grid;place-items:center;align-content:center;gap:4px;padding:6px 2px;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.bn b{font:700 12px Oxanium,sans-serif;letter-spacing:.04em}
.bn span{font:800 16px Oxanium,sans-serif;color:var(--gold)}
.bn.on{border-color:rgba(77,255,181,.5)}.bn.on span{color:var(--ok)}
.alert{display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%;color:inherit;cursor:pointer;padding:14px 18px}
.alert>span:first-child{display:grid;gap:2px}.alert .sys{margin:0}.alert .arr{font:700 28px Oxanium,sans-serif;color:var(--gold)}
.sqrow{display:flex;align-items:baseline;gap:12px}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.seg button{min-height:44px;padding:0 2px;font:700 11px Orbitron,sans-serif;letter-spacing:.06em;border:1px solid rgba(62,240,255,.3);background:rgba(62,240,255,.05);color:var(--dim);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.seg button.on{background:linear-gradient(100deg,var(--c2),var(--c1));color:#fff;border-color:transparent}
.ttl{background:none;border:0;padding:0;cursor:pointer;text-align:left}
.nextt{font-size:13px;color:var(--dim);margin:6px 0 0}
.tt .tp{display:block;height:4px;margin-top:6px;background:rgba(62,240,255,.12)}.tt .tp i{display:block;height:100%;background:var(--c1)}
.plist{display:grid;gap:8px;margin-top:10px}
.pm{display:flex;align-items:center;gap:12px;padding:8px 10px;border:1px solid rgba(62,240,255,.18)}
.pm.me{border-color:rgba(62,240,255,.5);background:rgba(62,240,255,.06)}
.pav{width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid;flex:none;background:#0b1430}
.pav img{width:100%;height:100%;object-fit:cover;transform:scale(1.8);transform-origin:50% 36%}
.pinfo{display:grid;flex:1;min-width:0}.pinfo b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pst{font:700 12px Oxanium,sans-serif;color:var(--dim);white-space:nowrap}.pst.ok{color:var(--ok)}
.trial{padding:12px 0;border-top:1px solid rgba(62,240,255,.14)}
.trial.lock{opacity:.55}
.trial.ok b{color:var(--ok)}
.sqtask{font:700 20px/1.3 'Chakra Petch',sans-serif;margin:4px 0}
.vnnext{align-self:flex-end;color:var(--c1);font-size:12px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.dcoach{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid rgba(62,240,255,.18);text-align:left}
.dcoach svg{width:84px;height:92px;display:block}
.dcoach img{width:84px;height:84px;display:block}
.dcoach b{font:700 12px Orbitron,sans-serif;letter-spacing:.08em;color:var(--c1)}
/* quests */
.quest{padding:12px 0;border-top:1px solid rgba(62,240,255,.14)}
.quest:first-of-type{border-top:0}
.qh{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.qh b{font-weight:600}
.qn{font:700 16px Oxanium,sans-serif;white-space:nowrap}
.qn.done{color:var(--ok)}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.dot{width:26px;height:26px;border:1px solid rgba(62,240,255,.45);transform:rotate(45deg) scale(.8)}
.dot.on{background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 0 10px rgba(62,240,255,.7)}
.ex{display:flex;align-items:center;gap:12px;min-height:46px;padding:4px 0;border-top:1px solid rgba(62,240,255,.12);cursor:pointer}
.ex input{width:22px;height:22px;accent-color:#3ef0ff;flex:none}
.ex.on span{color:var(--dim);text-decoration:line-through}
.field{display:flex;gap:8px;margin-top:10px}
.field input{flex:1;min-height:44px;font-size:16px;padding:0 12px;border:1px solid rgba(62,240,255,.4);background:rgba(2,6,16,.85)}
/* status */
.hero{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:14px;align-items:center}
.hero .av svg{width:100%;height:auto;display:block}
@media(max-width:480px){.hero{grid-template-columns:1fr;text-align:center}.hero .av{max-width:220px;margin:0 auto}.hero .rk{justify-content:center}}
.pname{font:900 24px/1.1 Orbitron,sans-serif;letter-spacing:.04em;margin:0}
.ttl{color:var(--gold);font-size:14px;margin:4px 0 0}
.rk{display:flex;align-items:center;gap:10px;margin:12px 0 6px}
.rk .lvl{font:800 clamp(44px,12vw,62px)/1 Oxanium,sans-serif;text-shadow:0 0 22px rgba(62,240,255,.7)}
.rk .lvl small{font-size:14px;color:var(--dim);margin-right:4px}
.rbadge{font:900 22px/1 Orbitron,sans-serif;padding:8px 12px;color:#05060d;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.radar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center}
.radar svg{width:100%;height:auto;display:block}
@media(max-width:480px){.radar{grid-template-columns:1fr}}
.slist div{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid rgba(62,240,255,.12)}
.slist b{font:800 20px Oxanium,sans-serif;color:var(--c1)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.cell{text-align:center;padding:8px 4px;background:rgba(62,240,255,.06);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.cell b{display:block;font:700 22px/1.1 Oxanium,sans-serif}
.cell span{font-size:12px;color:var(--dim)}
.tlist{display:grid;gap:8px;margin-top:8px}
.tt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid rgba(62,240,255,.2);background:none;text-align:left;width:100%;min-height:44px}
.tt.lock{opacity:.45;cursor:default}
.tt.eq{border-color:var(--gold);color:var(--gold)}
.log{list-style:none;margin:8px 0 0;padding:0}
.log li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid rgba(62,240,255,.12);font-size:14px}
.log li b{color:var(--c1);white-space:nowrap;font-family:Oxanium,sans-serif}
/* creator & coach picker */
.cc{position:fixed;inset:0;z-index:28;overflow:auto;background:rgba(3,5,12,.94);backdrop-filter:blur(6px);padding:calc(14px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom))}
.cc[hidden]{display:none}
.ccin{max-width:900px;margin:0 auto}
.ccgrid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
.ccprev{position:sticky;top:0}
.ccprev svg{width:100%;height:auto;display:block}
@media(max-width:640px){.ccgrid{grid-template-columns:1fr}.ccprev{position:static;max-width:230px;margin:0 auto}}
.opt{margin-bottom:12px}
.opt .lab{font:700 11px Oxanium,sans-serif;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;margin-bottom:6px}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:40px;height:40px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px rgba(255,255,255,.2) inset}
.sw button.on{border-color:var(--c1);box-shadow:0 0 12px var(--c1)}
.pill button{width:auto;height:auto;border-radius:0;box-shadow:none;min-height:40px;padding:0 14px;border:1px solid rgba(62,240,255,.3);background:rgba(62,240,255,.05);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.pill button.on{background:linear-gradient(100deg,var(--c2),var(--c1));color:#fff;border-color:transparent}
.coaches{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px;margin-top:12px}
.coachc{text-align:left;width:100%;cursor:pointer;color:inherit}
.coachc svg{width:150px;height:165px;display:block;margin:0 auto}
.coachc img{width:170px;height:170px;display:block;margin:0 auto}
.coachc .vnname{margin-top:4px}
.coachc.on{--k1:var(--gold);--k2:var(--gold)}
/* nav, toasts, dialogs, timer */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(4,6,13,.94);backdrop-filter:blur(12px);border-top:1px solid rgba(62,240,255,.25);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{background:none;border:0;min-height:60px;font:700 11px Orbitron,sans-serif;letter-spacing:.06em;color:var(--dim);display:grid;place-items:center;gap:2px;position:relative}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabs button.on{color:var(--c1);text-shadow:0 0 10px var(--c1)}
.tabs button.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:2px;background:linear-gradient(90deg,var(--c2),var(--c1));box-shadow:0 0 10px var(--c1)}
#toasts{position:fixed;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:35;display:grid;gap:6px;width:min(92vw,420px);pointer-events:none}
.toast{background:rgba(6,14,32,.96);border-left:3px solid var(--c1);padding:10px 14px;font-size:14px;box-shadow:0 0 18px rgba(62,240,255,.3);animation:tin .25s ease-out}
.toast::before{content:"SYSTEM ▸ ";color:var(--c1);font:700 12px Oxanium,sans-serif;letter-spacing:.08em}
@keyframes tin{from{opacity:0;transform:translateX(-12px)}}
.ov{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(2,4,10,.8);backdrop-filter:blur(4px)}
.ov[hidden]{display:none}
.dlg{width:min(100%,430px);max-height:88vh;overflow:auto;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
.dlg h2{font-size:18px}
.dlg textarea{width:100%;min-height:120px;font-size:13px;border:1px solid rgba(62,240,255,.4);background:rgba(2,6,16,.85);padding:10px;margin-top:8px}
.lvup{text-align:center}
.lvup .big{font:900 clamp(34px,10vw,48px)/1 Orbitron,sans-serif;color:var(--gold);text-shadow:0 0 26px rgba(255,207,90,.7);margin:8px 0}
.lvup .arrow{font:700 22px Oxanium,sans-serif}
.timer{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:24px;text-align:center;background:radial-gradient(700px 500px at 50% 30%,rgba(62,240,255,.16),transparent 70%),var(--bg)}
.timer[hidden]{display:none}
.timer .ph{font:900 clamp(26px,8vw,40px)/1.05 Orbitron,sans-serif;letter-spacing:.08em;color:var(--c1);text-shadow:0 0 20px var(--c1)}
.timer.walk .ph{color:var(--ok);text-shadow:0 0 20px rgba(77,255,181,.6)}
.timer .clock{font:800 clamp(72px,24vw,128px)/1 Oxanium,sans-serif;font-variant-numeric:tabular-nums}
.timer .bar{width:min(90vw,420px)}
.pimg{position:relative;aspect-ratio:1}
.pimg::before{content:"";position:absolute;inset:4%;border-radius:50%;background:radial-gradient(circle,var(--aura) 0%,color-mix(in srgb,var(--aura) 22%,transparent) 45%,transparent 70%);opacity:.7;animation:pulse 3.2s ease-in-out infinite}
.pimg::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;opacity:0}
.pimg.r0::before{opacity:.35}
.pimg.r1::before{opacity:.7}
.pimg.r2::before{opacity:.8}
.pimg.r2::after,.pimg.r3::after{opacity:1;inset:5%;border:2px dashed var(--aura);animation:spin 14s linear infinite;filter:drop-shadow(0 0 6px var(--aura))}
.pimg.r3::before{opacity:.95;inset:-2%}
.pimg.r3::after{border:3px dotted var(--aura);animation-duration:9s}
.pimg.r4::before,.pimg.r5::before{opacity:1;inset:-4%}
.pimg.r4::after,.pimg.r5::after{opacity:.85;inset:-6%;background:conic-gradient(from 0deg,transparent 0 6%,var(--aura) 9%,transparent 13% 22%,var(--aura) 26%,transparent 30% 47%,var(--aura) 51%,transparent 55% 70%,var(--aura) 74%,transparent 78% 90%,var(--aura) 94%,transparent 98%);-webkit-mask:radial-gradient(circle,transparent 36%,#000 46%,transparent 70%);mask:radial-gradient(circle,transparent 36%,#000 46%,transparent 70%);filter:blur(5px);animation:spin 7s linear infinite}
.pimg.r5::after{animation-duration:3.5s;filter:blur(2px);opacity:1}

function trackTotal(id, d) { if (id === 'push') S.totals.pushups += d; else if (id === 'squat') S.totals.squats += d; else if (id === 'cardio') S.totals.cardio += d; }

  if (!quiet) { burst(lastPt.x, lastPt.y, '#4dffb5', 24); sfx('success', [25, 30, 25]); }
  q.done = true; addXp(q.xp, q.cat, `Daily Quest: ${q.label}`);
  if (!checkDaily() && !quiet) questLine(id);

}

/* ================= run timer ================= */
let TM = null, actx = null, lock = null;
function cue(walk) {
 try { if (navigator.vibrate) navigator.vibrate(walk ? [150] : [200, 100, 200]); } catch (e) {}
 try {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.frequency.value = walk ? 520 : 880; o.connect(g); g.connect(actx.destination);
  g.gain.setValueAtTime(.25, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + .5);
  o.start(); o.stop(actx.currentTime + .5);
 } catch (e) {}
}
function startRun() { const R = S.runPlan; startTimer(RP[R.week].seg, `Week ${R.week + 1} · Day ${R.day + 1}`, runDone); }
function startTimer(seg, title, onDone, noSkip) {
 try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) { actx = null; }
 try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(l => lock = l).catch(() => {}); } catch (e) {}
 TM = {seg, i:0, left:seg[0][1], paused:false, last:Date.now(), total:seg.reduce((a, s) => a + s[1], 0), title, onDone, noSkip};
 $('#timer').hidden = false; TM.int = setInterval(tick, 250); drawTimer(); cue(true);
}
function tick() {
 const now = Date.now();
 if (TM.paused) { TM.last = now; return; }
 TM.left -= (now - TM.last) / 1000; TM.last = now;
 while (TM.left <= 0) {
  TM.i++;
  if (TM.i >= TM.seg.length) { stopTimer(true); return; }
  TM.left += TM.seg[TM.i][1]; cue(TM.seg[TM.i][0] !== 'Run');
 }
 drawTimer();
}
function drawTimer() {
 const s = TM.seg[TM.i], nx = TM.seg[TM.i + 1];
 const doneSec = TM.seg.slice(0, TM.i).reduce((a, x) => a + x[1], 0) + (s[1] - TM.left);
 const el = $('#timer');
 el.className = 'timer' + (s[0] === 'Run' ? '' : ' walk');
 el.innerHTML = `<p class="sys">${TM.title}${TM.seg.length > 1 ? ` · Interval ${TM.i + 1} of ${TM.seg.length}` : ''}</p>
  <div class="ph">${s[0].toUpperCase()}</div><div class="clock">${fmt(TM.left)}</div>
  <p class="dim">${nx ? `Next: ${nx[0]} ${fmt(nx[1])}` : 'Last interval'}</p>
  <div class="bar"><i style="width:${(doneSec / TM.total * 100).toFixed(1)}%"></i></div>
  <p class="dim small">${fmt(TM.total - doneSec)} left in session</p>
  <div class="btns" style="justify-content:center"><button class="b p" data-a="tpause">${TM.paused ? 'Resume' : 'Pause'}</button>${TM.noSkip ? '' : '<button class="b" data-a="tskip">Skip interval</button>'}<button class="b r" data-a="tquit">End</button></div>`;
}
function stopTimer(finished) {
 const done = TM.onDone;
 clearInterval(TM.int); TM = null;
 try { if (lock) lock.release(); } catch (e) {}
 lock = null; $('#timer').hidden = true;
 if (finished) { cue(false); done(); commit(); }
}

function spark(vals, lowerBetter) {
 const pts = vals.map((v, i) => [v, i]).filter(p => p[0] != null);

 const X = i => P + (W - 2 * P) * (i - x0) / Math.max(1, x1 - x0), Y = v => { let t = y1 === y0 ? .5 : (v - y0) / (y1 - y0); if (lowerBetter) t = 1 - t; return H - P - (H - 2 * P) * t; };
 const d = pts.map(p => `${X(p[1]).toFixed(1)},${Y(p[0]).toFixed(1)}`).join(' ');
 return `<svg viewBox="0 0 ${W} ${H}" class="spark" role="img" aria-label="Progress chart"><polyline points="${d}" fill="none" stroke="#3ef0ff" stroke-width="2.5" stroke-linejoin="round"/>${pts.map(p => `<circle cx="${X(p[1]).toFixed(1)}" cy="${Y(p[0]).toFixed(1)}" r="4" fill="#9b6bff" stroke="#fff" stroke-width="1.5"/>`).join('')}</svg>`;
}

function b64u8(b) { const p = '='.repeat((4 - b.length % 4) % 4), s = atob((b + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(s, c => c.charCodeAt(0)); }

 const T = S.today, ev = opener();
 setTimeout(() => sfx('chime', [40, 40, 40]), 150);
 let txt;
 if (!S.introDone) { S.introDone = true; T.checkin = true; save(); const c = coach(), list = c.first.map(t => fill(t)); txt = list[0]; sayQueue(list, 'first'); }
 else { txt = line(ev); sayQueue([{ev, text:txt}, ...(T.checkin ? [] : [checkinItem()])]); }
 dialog({title:'Daily Quest has arrived', body:`${(msgs || []).map(m => `<p style="color:var(--red)">${esc(m)}</p>`).join('')}
  <p class="dim small">${rankOf(S.level)}-Rank · Today's goals:</p>${T.quests.map(q => `<p>· ${q.label}: <b>${q.target}${q.unit}</b></p>`).join('')}
  ${S.penalty ? `<p style="color:var(--red)">· Penalty: <b>${S.penalty.target} push-ups</b></p>` : ''}
  ${S.gate && !S.gate.cleared ? `<p class="dim small" style="margin-top:8px">Weekly Gate: <b style="color:#ffd5db">${S.gate.boss}</b> · ${S.gate.hp}/${S.gate.max} HP</p>` : ''}${coachBlock(S.introDone && txt === CL.text && CL.queue.length ? 'first' : ev, txt)}`,
  buttons:[{label:'Accept', cls:'p full', fn:() => { quietUntil = Date.now() + 90e3; tab = 'quests'; render(); }}]});
}
function checkinItem() {
 S.today.checkin = true;
 const mood = k => () => { if (k === 'moodSore' && S.shields > 0 && S.streak > 0) say(k, line(k) + ` You've got ${S.shields} rest shield${S.shields === 1 ? '' : 's'} if you need a full rest day.`, [{label:'Use rest shield', fn:() => useShield()}, {label:"I'll push through", fn:() => say('moodFired', line('moodFired'))}]); else say(k, line(k)); };
 return {ev:'ask', text:line('ask'), choices:[{label:'Fired up', fn:mood('moodFired')}, {label:'Tired', fn:mood('moodTired')}, {label:'Sore', fn:mood('moodSore')}]};
}
/* ---- sudden quests ---- */
let quietUntil = 0;
const activePop = () => (S.today.pops || []).find(p => p.status === 'active');
function suddenTick() {
 if (!S.today || !S.introDone) return;
 if (!S.today.pops) { S.today.pops = makePops(); save(); }
 const now = Date.now(), a = activePop();
 if (a) {
  if (now >= a.exp) { a.status = 'missed'; quietUntil = now + 20 * 60e3; say('suddenMiss'); commit(); return; }
  const t = $('#sqTime'); if (t) t.textContent = fmt((a.exp - now) / 1000);
  return;
 }
 if (splashOn || TM || !$('#cc').hidden || mOpen || CL.queue.length || CL.choices.length || now < quietUntil) return;
 const due = S.today.pops.filter(x => x.status === 'pending' && x.at <= now);
 if (!due.length) return;
 const p = due[due.length - 1];
 due.slice(0, -1).forEach(x => { x.status = 'skipped'; });
 if (now - p.at > SQ_STALE) { p.status = 'skipped'; save(); return; }
 p.status = 'active'; p.exp = now + SQ_MIN * 60e3; save();
 sfx('alarm', [120, 60, 120, 60, 200]);
 const txt = line('sudden', {task:p.task});
 say('sudden', txt, [{label:'On it!', fn:() => say('next', line(S.today.complete ? 'train' : 'next'))}, {label:'Not now', fn:suddenSkip}]);
 dialog({cls:'gold', title:'SUDDEN QUEST', body:`<p class="sqtask">${esc(p.task)}</p><p>Reward: <b style="color:var(--gold)">+${p.xp} XP</b> · ${p.cat.toUpperCase()}</p><p class="dim small">You have ${SQ_MIN} minutes. Log it on the Quests screen when you're done.</p>${coachBlock('sudden', txt)}`,
  buttons:[{label:'Accept', cls:'p', fn:() => { CL.choices = []; tab = 'quests'; render(); window.scrollTo(0, 0); }}, {label:'Not now', fn:() => { suddenSkip(); commit(); }}]});
 tab === 'quests' && render();
}
function suddenDone() {
 const a = activePop(); if (!a) return;
 hit(15); a.status = 'done'; quietUntil = Date.now() + 20 * 60e3; S.totals.sudden = (S.totals.sudden || 0) + 1;
 addXp(a.xp, a.cat, `Sudden Quest: ${a.task}`);
 const c = ctx(); say('suddenDone', line('suddenDone') + (!S.today.complete && c.next ? ' ' + line('next') : ''));
}
function suddenSkip() { const a = activePop(); if (!a) return; a.status = 'declined'; quietUntil = Date.now() + 20 * 60e3; say('suddenSkip'); }
function setupFlow(after) { openCreator(() => openCoach(after)); }
function onboard() {
 dialog({title:'You have been chosen.', body:`<p>You've become a Player. Clear Daily Quests to level up, raise your stats and rank up from E to S.</p><p class="dim small">What should the System call you?</p>`,
  input:{value:'', placeholder:'Your name'},
  buttons:[{label:'Accept', cls:'p full', fn:v => { S.name = (v || '').trim().slice(0, 24) || 'Player'; save(); render(); setupFlow(() => arrival([])); }}]});
}

/* ================= events ================= */
document.addEventListener('click', e => {
 const tb = e.target.closest('[data-tab]');
 if (tb) { tab = tb.dataset.tab; try { history.replaceState(null, '', '#' + tab); } catch (x) {} render(); window.scrollTo(0, 0); return; }
 const el = e.target.closest('[data-a]');
 if (!el || el.disabled) return;
 if (el.classList.contains('b') || el.classList.contains('bn')) sfx('tap', [8]);
 const a = el.dataset.a, id = el.dataset.id, n = Number(el.dataset.n);
 const qs = id && S.today.quests.find(q => q.id === id);
 switch (a) {
  case 'coachtap':
   if (CL.shown < CL.text.length) { CL.shown = CL.text.length; clearInterval(typeInt); const t = $('#vnText'); if (t) t.innerHTML = typed(); const nx = document.querySelector('.vnnext'); if (nx) nx.textContent = CL.choices.length ? '' : CL.queue.length ? '▼ more' : '▼ tap'; showChoices(); }
   else if (CL.choices.length) return;
   else if (CL.queue.length) { const rest = CL.queue.slice(1), it = CL.queue[0]; say(it.ev, it.text, it.choices); CL.queue = rest; }
   else talk();
   return;
  case 'vnchoice': { const c = CL.choices[+el.dataset.i]; CL.choices = []; if (c) c.fn(); commit(); return; }
  case 'sqdone': suddenDone(); break;
  case 'shield': shieldPrompt(); return;
  case 'cloudon': cloudCreate(); commit(); syncNow(true); return;
  case 'cloudlink': linkPrompt(); return;
  case 'cloudsync': syncNow(true); return;
  case 'copycode': copyText(`${S.cloud.id}-${S.cloud.token}`, 'Sync code copied. Keep it private.'); return;
  case 'cloudoff':
   dialog({title:'Turn off cloud save?', body:'<p>This device stops syncing. Your cloud copy stays saved, so you can link it again with your sync code.</p><p class="dim small">Copy your sync code first if you might want it later.</p>',
    buttons:[{label:'Turn off', cls:'r', fn:() => { if (S.notify) disableNotify(); S.cloud = null; S.party = null; partyData = null; commit(); }}, {label:'Cancel', cls:'p'}]}); return;
  case 'tnotify': if (S.notify) disableNotify(); else enableNotify(); return;
  case 'pcreate': partyCreatePrompt(); return;
  case 'pjoin': partyJoinPrompt(); return;
  case 'prefresh': loadParty(true); return;
  case 'pinvite': copyText(`Join my party on Ascend! Open ${location.origin}${location.pathname} → Status → Party → Join, and enter code ${S.party.code}`, 'Invite copied. Send it to your party!'); return;
  case 'pleave': dialog({title:'Leave the party?', body:`<p>You can rejoin later with code ${S.party.code}.</p>`, buttons:[{label:'Leave', cls:'r', fn:() => { partyAction('leave', {code:S.party.code}); }}, {label:'Cancel', cls:'p'}]}); return;
  case 'goparty': tab = 'status'; sview = 'party'; window.scrollTo(0, 0); break;
  case 'ptopen': openTest(); return;
  case 'ptwatch': toggleWatch(); return;
  case 'ptsave': saveTest(); commit(); return;
  case 'story': playStory(+el.dataset.r); return;
  case 'tsound': S.sound = S.sound === false; if (S.sound) sfx('success'); break;
  case 'thaptic': S.haptics = S.haptics === false; if (S.haptics) sfx('tap', [40]); break;
  case 'focusq': focusQ = id; break;
  case 'sview': sview = el.dataset.v; window.scrollTo(0, 0); break;
  case 'trialtimer': { const i = +el.dataset.i; startTimer(EXAMS[S.exam.to][i].timer, `${RANKS[S.exam.to]}-Rank Exam`, () => passTrial(i), true); return; }
  case 'trialpass': { const i = +el.dataset.i, x = EXAMS[S.exam.to][i];
   dialog({title:'Trial complete?', body:`<p><b>${x.t}</b></p><p class="dim small">Only mark it if you did it for real, in one go. The System is watching.</p>`,
    buttons:[{label:'Yes, passed', cls:'p', fn:() => { passTrial(i); commit(); }}, {label:'Not yet'}]}); return; }
  case 'sqskip': suddenSkip(); break;
   return;
  case 'qadd': questAdd(id, n); break;
  case 'qminus': questAdd(id, -qs.steps[0]); break;
  case 'qfill': questAdd(id, qs.target); break;
  case 'padd': penaltyAdd(n); break;
  case 'water': water(); break;
  case 'go': tab = el.dataset.t; if (tab === 'status') sview = 'hunter'; window.scrollTo(0, 0); break;
  case 'wk': return;
  case 'wkdone': workoutDone(); break;
  case 'run': startRun(); return;
  case 'runmanual':
   dialog({title:'Log run without timer?', body:`<p>Mark Week ${S.runPlan.week + 1} Day ${S.runPlan.day + 1} as done.</p>`, buttons:[{label:'Log it', cls:'p', fn:() => { runDone(); commit(); }}, {label:'Cancel'}]});
   return;
  case 'runreset':
   dialog({title:'Restart the run plan?', body:'<p>You go back to Week 1 Day 1. Your title and XP stay.</p>', buttons:[{label:'Restart', cls:'g', fn:() => { S.runPlan = {week:0, day:0, done:false}; commit(); }}, {label:'Cancel'}]});
   return;
  case 'tpause': TM.paused = !TM.paused; drawTimer(); return;
  case 'tskip': TM.left = 0; tick(); return;
  case 'tquit':
   TM.paused = true; drawTimer();
   dialog({title:'End this session?', body:'<p>It won\'t count.</p>', buttons:[{label:'End session', cls:'r', fn:() => stopTimer(false)}, {label:'Keep going', cls:'p', fn:() => { if (TM) { TM.paused = false; drawTimer(); } }}]});
   return;
  case 'pickchar': { S.avatar = {char:id}; const d = ccDone; ccDone = null; closeCC(); commit(); if (d) d(); else toast('Hunter selected.'); return; }
  case 'pickcoach': {
   S.coach = id; preloadCoach(); const d = cpDone; cpDone = null; closeCC(); commit();
   if (d) d(); else { say(opener()); toast(`${coach().name} is now your coach.`); }
   return;
  }
  case 'ccclose': closeCC(); return;
  case 'editav': openCreator(); return;
  case 'editcoach': openCoach(); return;
  case 'rename':
   dialog({title:'Rename', input:{value:S.name}, buttons:[{label:'Save', cls:'p', fn:v => { S.name = (v || '').trim().slice(0, 24) || S.name; commit(); }}, {label:'Cancel'}]});
   return;
  case 'equip': S.title = id; break;
  case 'export': {
   const code = JSON.stringify(S);
   const show = () => dialog({title:'Your save code', body:'<p class="dim small">Select all and copy it somewhere safe, like your notes.</p>', area:{value:code, readonly:true}, buttons:[{label:'Done', cls:'p'}]});
   try { navigator.clipboard.writeText(code).then(() => toast('Save code copied.'), show); } catch (x) { show(); }
   return;
  }
  case 'import':
   dialog({title:'Restore from code', body:'<p class="dim small">This replaces your current progress.</p>', area:{value:''},
    buttons:[{label:'Restore', cls:'p', fn:v => {
     try { const d = JSON.parse(v); if (!d || d.v !== 1 || !d.today) throw 0; S = d; rollover(); commit(); say(opener()); toast('Progress restored.'); }
     catch (x) { toast('That code didn\'t work. Check you copied all of it.'); return false; }
    }}, {label:'Cancel'}]});
   return;
  case 'reset':
   dialog({title:'Reset everything?', body:'<p>Your level, stats, titles, character and log are wiped. This can\'t be undone.</p>',
    buttons:[{label:'Reset', cls:'r', fn:() => { S = fresh(); rollover(); commit(); onboard(); }}, {label:'Cancel', cls:'p'}]});
   return;
 }
 commit();
});
document.addEventListener('change', e => {
 const el = e.target.closest('[data-a="wk"]'); if (!el) return;
 S.today.wk[+el.dataset.i] = el.checked; commit();
});
document.addEventListener('submit', e => {
 const f = e.target.closest('[data-f="walk"]'); if (!f) return;
 e.preventDefault(); walkLog($('#walkMin').value); commit();
});
const dayCheck = () => { const m = rollover(); if (m) { render(); arrival(m); } };
document.addEventListener('visibilitychange', () => { if (!document.hidden) dayCheck(); });
setInterval(dayCheck, 60000);
setInterval(suddenTick, 1000);
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.includes(h)) { tab = h; render(); } });

/* ================= web app: install, offline, updates ================= */
let installEvt = null;
const isStandalone = () => { try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } };
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function installHTML() {
 if (isStandalone()) return '<p class="clear">Installed. Ascend is running as an app.</p><p class="dim small">Works offline. Your progress stays on this device.</p>';
 if (installEvt) return '<p class="dim small">Put Ascend on your home screen. It opens full-screen and works offline.</p><button class="b p" data-a="install">Install Ascend</button>';
 if (isIOS()) return '<p class="dim small">On iPhone: open this page in <b>Safari</b>, tap the <b>Share</b> button, then <b>Add to Home Screen</b>. It opens full-screen and works offline.</p>';
 return '<p class="dim small">Open your browser menu and choose <b>Install app</b> or <b>Add to Home screen</b>. It opens full-screen and works offline.</p>';
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (tab === 'log') render(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('Ascend installed. Find it on your home screen.'); if (tab === 'log') render(); });
document.addEventListener('click', e => {
 if (!e.target.closest('[data-a="install"]') || !installEvt) return;
 const ev = installEvt; installEvt = null;
 try { ev.prompt(); ev.userChoice.then(() => { if (tab === 'log') render(); }); } catch (x) {}
});
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
try {
 if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  let reloading = false, wantReload = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (wantReload && !reloading) { reloading = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js').then(reg => {
   const offer = w => dialog({title:'Update ready', body:'<p>A new version of Ascend is ready. Your progress is kept.</p>',
    buttons:[{label:'Update now', cls:'p', fn:() => { wantReload = true; w.postMessage('SKIP_WAITING'); }}, {label:'Later'}]});
   if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
   reg.addEventListener('updatefound', () => {
    const w = reg.installing;
    w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
   });
   document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
 }
} catch (e) {}

/* ================= boot ================= */
preloadCoach();
const firstRun = !S.today;
if (S.today) gateCheck();
const msgs = rollover();
render();
function startApp() {
 if (firstRun) onboard();
 else if (!S.avatar || !S.avatar.char || !S.coach) setupFlow(() => arrival(msgs || []));
 else if (msgs) arrival(msgs);
 else say(opener());
}
/* ---- splash: boot animation while art preloads ---- */
var splashOn = true;
{
 const sp = $('#splash'), bar = $('#spBar'), msg = $('#spMsg'), t0 = Date.now();
 let reduced = false; try { reduced = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
 const MIN = reduced ? 500 : 2300, MAX = 5000;
 const steps = ['Initializing System', 'Syncing Daily Quests', 'Calibrating stats', firstRun ? 'Preparing Hunter selection' : 'Summoning ' + coach().name.charAt(0) + coach().name.slice(1).toLowerCase(),
  firstRun ? 'Awaiting new Player' : 'Welcome back, ' + S.name];
 const urls = [];
 if (S.avatar && S.avatar.char) ['neutral', 'happy'].forEach(e => urls.push(charSrc(e)));
 if (S.coach && coach().img) ['smile', 'happy'].forEach(e => urls.push(`assets/coaches/coach_${coachId()}_${e}.webp`));
 if (firstRun) PLAYERS.slice(0, 4).forEach(p => urls.push(charSrc('neutral', p.id)));
 let loaded = 0; const total = urls.length || 1;
 const ready = Promise.all(urls.map(u => new Promise(r => { const i = new Image(); i.onload = i.onerror = () => { loaded++; r(); }; i.src = u; })));
 let si = 0;
 const stepT = setInterval(() => {
  const time = Math.min(1, (Date.now() - t0) / MIN), load = urls.length ? loaded / total : 1;
  bar.style.width = (Math.min(time, load) * 100).toFixed(0) + '%';
  const want = Math.min(steps.length - 1, Math.floor(Math.min(time, load) * (steps.length - 1) + .001));
  if (want !== si) { si = want; msg.textContent = steps[si]; }
 }, 90);
 let done = false;
 const finish = () => {
  if (done) return; done = true; clearInterval(stepT);
  bar.style.width = '100%'; msg.textContent = steps[steps.length - 1];
  setTimeout(() => {
   sp.classList.add('out'); $('main').classList.add('enter'); $('.top').classList.add('enter');
   setTimeout(() => { sp.remove(); splashOn = false; startApp(); cloudPull().then(() => loadParty(true)); }, reduced ? 200 : 650);
  }, reduced ? 100 : 380);
 };
 Promise.race([ready, new Promise(r => setTimeout(r, MAX))]).then(() => setTimeout(finish, Math.max(0, MIN - (Date.now() - t0))));
 sp.addEventListener('click', () => { if (Date.now() - t0 > 600) finish(); });
}
}
</script>
</body>
</html>
